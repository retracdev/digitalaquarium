<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="da-tile" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9C8FF"/><stop offset=".5" stop-color="#9C7BF2"/><stop offset="1" stop-color="#5B36C8"/>
    </linearGradient>
    <linearGradient id="da-tile-rim" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="da-fish" x1="0" y1="22" x2="0" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".92"/><stop offset="1" stop-color="#E4D9FF" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="da-fish-rim" x1="0" y1="22" x2="0" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="da-bub" x1="0" y1="9" x2="0" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A47CFF"/><stop offset="1" stop-color="#5A2AD0"/>
    </linearGradient>
    <linearGradient id="da-bub-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <path id="da-fish-shape" d="M50 39C50 31.5 43.5 26.5 36 26.5C33.5 26.5 32 23.2 28.6 23.2C25.6 23.2 25 26 26.6 28.2C24.5 30 23 32.5 22.5 34.5C19.5 31 15.5 28.5 12.5 28.8C10.3 29 9.6 31 10.4 33C11 34.8 12.4 36.8 13.5 39C12.4 41.2 11 43.2 10.4 45C9.6 47 10.3 49 12.5 49.2C15.5 49.5 19.5 47 22.5 43.5C25 48.5 30 51.5 36 51.5C43.5 51.5 50 46.5 50 39Z"/>
    <g id="da-bubbles">
      <circle cx="50.5" cy="28" r="5"/>
      <circle cx="54.5" cy="16.5" r="3.3"/>
      <circle cx="47" cy="11" r="2.2"/>
    </g>
    <clipPath id="da-clip-fish"><use href="#da-fish-shape"/></clipPath>
    <clipPath id="da-clip-tile"><rect width="64" height="64" rx="14.5"/></clipPath>
    <mask id="da-out-fish" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/><use href="#da-fish-shape" fill="#000"/>
    </mask>
    <mask id="da-out-bub" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/><use href="#da-bubbles" fill="#000"/>
    </mask>
    <filter id="da-blur2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="da-blur1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.1"/></filter>
  </defs>

  <rect width="64" height="64" rx="14.5" fill="url(#da-tile)"/>
  <rect x=".6" y=".6" width="62.8" height="62.8" rx="13.9" fill="none" stroke="url(#da-tile-rim)" stroke-width="1.2"/>

  <g clip-path="url(#da-clip-tile)" mask="url(#da-out-fish)">
    <use href="#da-fish-shape" transform="translate(0 2.5)" fill="#2E1675" opacity=".32" filter="url(#da-blur2)"/>
  </g>

  <use href="#da-fish-shape" fill="url(#da-fish)"/>
  <use href="#da-fish-shape" fill="none" stroke="url(#da-fish-rim)" stroke-width="2" stroke-linejoin="round" clip-path="url(#da-clip-fish)"/>
  <path d="M31 33c2.2 3.6 2.2 8.4 0 12" fill="none" stroke="#5B36C8" stroke-opacity=".3" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="43" cy="37" r="2.2" fill="#5B36C8" opacity=".42"/>

  <g clip-path="url(#da-clip-tile)" mask="url(#da-out-bub)">
    <use href="#da-bubbles" transform="translate(0 1.5)" fill="#2E1675" opacity=".35" filter="url(#da-blur1)"/>
  </g>

  <g fill="url(#da-bub)" fill-opacity=".9" stroke="url(#da-bub)" stroke-width="1.6" stroke-linejoin="round">
    <use href="#da-bubbles"/>
  </g>
  <g fill="none" stroke="url(#da-bub-hi)" stroke-width=".8">
    <circle cx="50.5" cy="28" r="4.35"/>
    <circle cx="54.5" cy="16.5" r="2.7"/>
    <circle cx="47" cy="11" r="1.7"/>
